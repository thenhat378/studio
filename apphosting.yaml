# Cấu hình Firebase App Hosting tối ưu cho Next.js 15
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: FIREBASE_API_KEY
  - variable: FIREBASE_API_KEY
    secret: FIREBASE_API_KEY

# Tự động hóa quá trình build và deploy khi push code lên GitHub
scripts:
  build: npm run build
